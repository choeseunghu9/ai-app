<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https:;">
  <title>퍼스널 ai</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">P</span><div><strong>퍼스널 ai</strong><small>나만의 데스크톱 비서</small></div></div>
      <nav aria-label="주요 메뉴">
        <button class="nav-item active" data-page="chat">대화</button>
        <button class="nav-item" data-page="calendar">일정</button>
        <button class="nav-item" data-page="shortcuts">앱 바로가기</button>
        <button class="nav-item" data-page="settings">설정</button>
      </nav>
      <div class="sidebar-foot"><span class="dot"></span> 데이터는 이 PC에 저장됩니다</div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div><span class="eyebrow">PERSONAL ASSISTANT</span><h1 id="page-title">대화</h1></div><span id="status-pill" class="status-pill">AI 연결 준비 중</span></header>
      <section id="page-content" class="page-content" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="./renderer.js"></script>
</body>
</html>
